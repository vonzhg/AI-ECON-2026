[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-olg-demo"
version = "0.1.0"
description = "Portable RAG demo over Spear and Young's OLG paper for macroeconomics teaching."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rag-olg = "rag_olg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
