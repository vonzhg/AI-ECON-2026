# Lecture 9 reorganization manifest (Phase A of the 2026-09 reorganization).
#
# Source of truth for which old frame goes where, at what tier, with which
# reference edits.  Read only by tools/lec09_assemble.py:
#   python3 tools/lec09_assemble.py check      # every source frame used once, edits apply
#   python3 tools/lec09_assemble.py assemble   # write the eleven decks
#   python3 tools/lec09_assemble.py summary    # tier counts per deck
#
# Plan: Lec09_Reorg_Plan_2026-09-12.md (v1 dispositions) as amended by
# Lec09_Reorg_Plan_Review_2026-09-12.md (A1-A9).  Source decks: _archive/five_acts_2026-07/.
#
# Item kinds (in teaching order):
#   frame: <ID>            one source frame; tag KEEP|MOVE|EDIT; edits = exact-string replacements
#   merge: [<ID>, <ID>]    Phase A emits both frames in order; Phase B merges them
#   new: <title>           placeholder (or drafted `body`) with a Phase B `todo`
#   section: <title>       \section + \sectiondivider{title}{divider}
# Tiers (review A1): CORE = the Oct 22 path, LAB = used during the lab, READ = self-study.
# Edits apply in Phase A; `todo` lines are written into the deck as "% TODO(Phase B):" comments.

